# fly.toml  –  Fly.io (Machines v2) deployment for Bol Bachchan
# Docs: https://fly.io/docs/reference/configuration/
#
# Quick-start:
#   fly launch --no-deploy        (creates app, say yes to volume prompt)
#   fly secrets set GEMINI_API_KEY="..." OWNER_JID="..."
#   fly deploy
#
app = "bol-bachchan"
primary_region = "bom"            # Mumbai – lowest latency for India

[build]
  # Uses the repo Dockerfile.

# Non-secret environment defaults.  Secrets go via `fly secrets set`.
[env]
  LOG_LEVEL            = "INFO"
  DATABASE_URL         = "sqlite:///data/bol_bachchan.db"
  NEONIZE_SESSION_PATH = "data/neonize.db"
  OWNER_TIMEZONE       = "Asia/Kolkata"
  GEMINI_MODEL         = "gemini-2.5-flash"
  MEDIA_DIR            = "data/media"

# Persistent volume – SQLite DB, Neonize session, downloaded media.
# Created automatically during `fly launch` or manually with:
#   fly volumes create bol_data --region bom --size 1
[[mounts]]
  source      = "bol_data"
  destination = "/app/data"

# HTTP service – exposes the internal health-check port so Fly can
# monitor the machine.  The bot itself has no public web interface.
[http_service]
  internal_port       = 8080
  auto_stop_machines  = "off"     # keep the bot always running
  auto_start_machines = true
  min_machines_running = 1        # never scale to zero

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

# Health check – Fly probes this to know the process is alive.
[[http_service.checks]]
  interval     = "30s"
  timeout      = "5s"
  grace_period = "30s"
  method       = "GET"
  path         = "/"

# Machine sizing – shared CPU, 512 MB handles Python + Neonize + ffmpeg.
[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
