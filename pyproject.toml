[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bol-bachchan"
version = "0.1.0"
description = "A private multilingual WhatsApp assistant"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "google-genai==1.75.0",
    "google-auth==2.56.3",
    "httpx>=0.28,<1",
    "neonize>=0.4.3,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
bol-bachchan = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
